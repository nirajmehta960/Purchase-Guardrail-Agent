name: Data Pipeline CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data_pipeline/**"
      - "savviocore/**"
      - ".github/workflows/datapipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "data_pipeline/**"
      - "savviocore/**"
      - ".github/workflows/datapipeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ${{ vars.AR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/${{ vars.AR_IMAGE_DATAPIPELINE }}

jobs:
  # ===========================================================================
  # JOB 1 — Unit tests + DAG validation
  # ===========================================================================
  unit-tests:
    name: Unit Tests & DAG Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt

      - name: Install dependencies
        working-directory: data_pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ../savviocore
          pip install "apache-airflow>=3.0.0" \
                      "apache-airflow-providers-standard" \
                      "apache-airflow-providers-smtp" \
                      "apache-airflow-providers-celery"
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validate DAG parses correctly
        working-directory: data_pipeline
        env:
          PYTHONPATH: dags
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'dags')
          import data_pipeline_airflow as dag_module
          dag = dag_module.dag
          print(f"DAG parsed OK — id: {dag.dag_id}, tasks: {len(dag.tasks)}")
          for t in dag.tasks:
              print(f"  - {t.task_id}")
          PY

      - name: Run unit tests
        working-directory: data_pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/data_pipeline
        run: |
          python -m pytest \
            tests/bias/ tests/database/ tests/features/ \
            tests/ingestion/ tests/preprocess/ tests/validation/ \
            -v --tb=short --cov=dags/src --cov-report=term-missing

  # ===========================================================================
  # JOB 2 — Build & Push Image to Artifact Registry (main only)
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: data_pipeline/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # ===========================================================================
  # JOB 3 — Deploy to Airflow VM (main only, pull pre-built image)
  # ===========================================================================
  deploy:
    name: Deploy to Airflow VM
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap VM directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          timeout: 30s
          envs: VM_DEPLOY_PATH
          script: |
            set -euo pipefail
            mkdir -p "$VM_DEPLOY_PATH/logs" "$VM_DEPLOY_PATH/config"
        env:
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}

      - name: Write .env from Secret Manager
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          timeout: 60s
          envs: VM_DEPLOY_PATH,SECRET_PREFIX,GCS_BUCKET_NAME,VERTEX_LOCATION,GCP_CREDENTIALS_PATH,DB_HOST,DB_PORT,DB_USER,DB_NAME,SMTP_HOST,SMTP_PORT,SMTP_USER,ALERT_EMAIL_FROM,ALERT_EMAIL_LIST,ALERT_EMAIL_CC
          script: |
            set -euo pipefail
            shopt -s inherit_errexit

            PROJECT_ID=$(curl -sf \
              "http://metadata.google.internal/computeMetadata/v1/project/project-id" \
              -H "Metadata-Flavor: Google")

            fetch() {
              gcloud secrets versions access latest \
                --secret="${SECRET_PREFIX}-$1" \
                --project="$PROJECT_ID"
            }

            DB_PASSWORD=$(fetch db-password)
            SMTP_PASSWORD=$(fetch smtp-password)
            AIRFLOW_WWW_PWD=$(fetch airflow-www-password)

            cat > "$VM_DEPLOY_PATH/.env" <<ENVEOF
            GCP_PROJECT_ID=$PROJECT_ID
            GCS_BUCKET_NAME=$GCS_BUCKET_NAME
            GCS_RAW_PATH=raw/
            GCS_PROCESSED_PATH=processed/
            GCS_FEATURES_PATH=features/
            GCS_VALIDATED_PATH=validated/
            FINANCIAL_BLOB=raw/financial_data.csv
            PRODUCT_BLOB=raw/product_data.jsonl
            REVIEW_BLOB=raw/review_data.jsonl
            DATA_DIR=dags/data
            ENVIRONMENT=prod
            DATA_SOURCE=gcs
            AIRFLOW_UID=50000
            AIRFLOW_PROJ_DIR=.
            _AIRFLOW_WWW_USER_USERNAME=airflow
            _AIRFLOW_WWW_USER_PASSWORD=$AIRFLOW_WWW_PWD
            LOG_LEVEL=INFO
            LOG_DIR=logs
            MAX_MISSING_VALUES_PCT=0.1
            MIN_RECORDS_REQUIRED=100
            MONTHLY_INCOME_COLS=income,salary
            MONTHLY_EXPENSE_COLS=rent,bills,subscriptions
            JSONL_STREAM_CHUNKSIZE=100000
            JSONL_LARGE_FILE_MB=300
            JSONL_MAX_OBJECT_SIZE=33554432
            UPSERT_CHUNK_SIZE=5000
            REVIEWS_INSERT_PAGE_SIZE=25000
            DUCKDB_MEMORY_LIMIT=1000MB
            DUCKDB_THREADS=2
            DUCKDB_TEMP_DIRECTORY=/tmp
            VERTEX_LOCATION=$VERTEX_LOCATION
            VERTEX_PROJECT=$PROJECT_ID
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_HOST=cloud-sql-proxy
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASSWORD=$SMTP_PASSWORD
            ALERT_EMAIL_FROM=$ALERT_EMAIL_FROM
            ALERT_EMAIL_LIST=$ALERT_EMAIL_LIST
            ALERT_EMAIL_CC=$ALERT_EMAIL_CC
            ENVEOF

            chmod 600 "$VM_DEPLOY_PATH/.env"
            echo ".env written ($(wc -l < "$VM_DEPLOY_PATH/.env") lines, perms $(stat -c '%a' "$VM_DEPLOY_PATH/.env"))."
        env:
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}
          SECRET_PREFIX: ${{ vars.SECRET_PREFIX || 'savvio' }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME || 'savvio-data-bucket' }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION || 'us-east1' }}
          GCP_CREDENTIALS_PATH: ${{ vars.GCP_CREDENTIALS_PATH || '/opt/airflow/config/savvio-gcp-key.json' }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_LIST: ${{ vars.ALERT_EMAIL_LIST }}
          ALERT_EMAIL_CC: ${{ vars.ALERT_EMAIL_CC || '' }}

      - name: Sync docker-compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          source: "data_pipeline/docker-compose.yaml,data_pipeline/docker-compose.prod.yaml"
          target: "${{ vars.VM_DEPLOY_PATH }}/"
          strip_components: 1

      - name: Deploy new image on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: IMAGE_TAG,VM_DEPLOY_PATH,AR_REGION
          script: |
            set -euo pipefail

            ACCESS_TOKEN=$(curl -sf \
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
              -H "Metadata-Flavor: Google" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
            echo "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "${AR_REGION}-docker.pkg.dev"

            cd "$VM_DEPLOY_PATH"
            echo "IMAGE_TAG=$IMAGE_TAG" > .env.ci

            DC="docker compose --env-file .env --env-file .env.ci -f docker-compose.yaml -f docker-compose.prod.yaml"

            $DC pull
            $DC up -d --remove-orphans

            echo "Deployed $IMAGE_TAG"
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}
          AR_REGION: ${{ vars.AR_REGION }}

  # ===========================================================================
  # JOB 4 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, build-and-push, deploy]
    if: always() && contains(needs.*.result, 'failure')

    steps:
      - name: Log failure summary
        run: |
          echo "Data Pipeline CI/CD FAILED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send failure email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ vars.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ vars.ALERT_EMAIL_FROM }}>
          to: ${{ vars.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][FAILED] Data Pipeline CI/CD — ${{ github.ref_name }} @ ${{ github.sha }}"
          body: |
            Data Pipeline CI/CD FAILED

            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Event:        ${{ github.event_name }}

            Per-job results:
              unit-tests:     ${{ needs.unit-tests.result }}
              build-and-push: ${{ needs.build-and-push.result }}
              deploy:         ${{ needs.deploy.result }}

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ===========================================================================
  # JOB 5 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [unit-tests, build-and-push, deploy]
    if: |
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')

    steps:
      - name: Log success summary
        run: |
          echo "Data Pipeline CI/CD PASSED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"

      - name: Send success email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ vars.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ vars.ALERT_EMAIL_FROM }}>
          to: ${{ vars.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][OK] Data Pipeline CI/CD — ${{ github.ref_name }} @ ${{ github.sha }}"
          body: |
            Data Pipeline CI/CD PASSED

            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
