name: Data Pipeline CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data_pipeline/**"
      - "savviocore/**"
      - ".github/workflows/datapipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "data_pipeline/**"
      - "savviocore/**"
      - ".github/workflows/datapipeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ${{ vars.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/${{ vars.AR_IMAGE_DATAPIPELINE }}

jobs:
  # ===========================================================================
  # JOB 1 — Unit tests + DAG validation
  # ===========================================================================
  unit-tests:
    name: Unit Tests & DAG Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt

      - name: Install dependencies
        working-directory: data_pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ../savviocore
          pip install "apache-airflow>=3.0.0" \
                      "apache-airflow-providers-standard" \
                      "apache-airflow-providers-smtp"
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validate DAG parses correctly
        working-directory: data_pipeline
        env:
          PYTHONPATH: dags
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'dags')
          import data_pipeline_airflow as dag_module
          dag = dag_module.dag
          print(f"DAG parsed OK — id: {dag.dag_id}, tasks: {len(dag.tasks)}")
          for t in dag.tasks:
              print(f"  - {t.task_id}")
          PY

      - name: Run unit tests
        working-directory: data_pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/data_pipeline
        run: |
          python -m pytest \
            tests/bias/ tests/database/ tests/features/ \
            tests/ingestion/ tests/preprocess/ tests/validation/ \
            -v --tb=short --cov=dags/src --cov-report=term-missing

  # ===========================================================================
  # JOB 2 — Build & Push Image to Artifact Registry (main only)
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: data_pipeline/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # ===========================================================================
  # JOB 3 — Deploy to Airflow VM (main only, pull pre-built image)
  # ===========================================================================
  deploy:
    name: Deploy to Airflow VM
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy new image on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: IMAGE_TAG,DAG_ID,GITHUB_SHA,GITHUB_RUN_ID,VM_DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$VM_DEPLOY_PATH"

            echo "IMAGE_TAG=$IMAGE_TAG" > .env.ci

            sudo --preserve-env=IMAGE_TAG docker compose \
              --env-file .env --env-file .env.ci \
              -f docker-compose.yaml -f docker-compose.prod.yaml \
              pull

            sudo --preserve-env=IMAGE_TAG docker compose \
              --env-file .env --env-file .env.ci \
              -f docker-compose.yaml -f docker-compose.prod.yaml \
              up -d --remove-orphans

            for i in $(seq 1 20); do
              if sudo docker compose \
                   --env-file .env --env-file .env.ci \
                   -f docker-compose.yaml -f docker-compose.prod.yaml \
                   exec -T airflow-scheduler airflow dags list >/dev/null 2>&1; then
                echo "Airflow scheduler is ready."
                break
              fi
              echo "Waiting for Airflow ($i/20)..."
              sleep 15
            done

            sudo docker compose \
              --env-file .env --env-file .env.ci \
              -f docker-compose.yaml -f docker-compose.prod.yaml \
              exec -T airflow-scheduler \
              airflow dags trigger "$DAG_ID" \
              --run-id "deploy__${GITHUB_SHA}__${GITHUB_RUN_ID}" || \
              echo "DAG trigger skipped (already triggered or scheduler not ready)."

            echo "Deployed $IMAGE_TAG"
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DAG_ID: ${{ vars.AIRFLOW_DAG_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}

  # ===========================================================================
  # JOB 4 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, build-and-push, deploy]
    if: always() && contains(needs.*.result, 'failure')

    steps:
      - name: Log failure summary
        run: |
          echo "Data Pipeline CI/CD FAILED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send failure email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ secrets.ALERT_EMAIL_FROM }}>
          to: ${{ secrets.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][FAILED] Data Pipeline CI/CD — ${{ github.ref_name }} @ ${{ github.sha }}"
          body: |
            Data Pipeline CI/CD FAILED

            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Event:        ${{ github.event_name }}

            Per-job results:
              unit-tests:     ${{ needs.unit-tests.result }}
              build-and-push: ${{ needs.build-and-push.result }}
              deploy:         ${{ needs.deploy.result }}

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ===========================================================================
  # JOB 5 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [unit-tests, build-and-push, deploy]
    if: |
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'

    steps:
      - name: Log success summary
        run: |
          echo "Data Pipeline CI/CD PASSED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"

      - name: Send success email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ secrets.ALERT_EMAIL_FROM }}>
          to: ${{ secrets.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][OK] Data Pipeline CI/CD — ${{ github.ref_name }} @ ${{ github.sha }}"
          body: |
            Data Pipeline CI/CD PASSED

            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
