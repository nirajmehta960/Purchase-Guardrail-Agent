name: Data Pipeline CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'data_pipeline/**'
      - 'savviocore/**'
  pull_request:
    branches: [main]
    paths:
      - 'data_pipeline/**'
      - 'savviocore/**'
  workflow_dispatch:

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests + DAG Validation
  # ===========================================================================
  unit-tests:
    name: Unit Tests & DAG Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-datapipeline-${{ hashFiles('data_pipeline/data-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-datapipeline-

      - name: Install dependencies
        working-directory: data_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          if [ -f data-requirements.txt ]; then pip install -r data-requirements.txt; fi
          pip install pytest pytest-cov

      - name: Validate DAG parses correctly
        working-directory: data_pipeline
        env:
          PYTHONPATH: dags
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'dags')
          import data_pipeline_airflow as dag_module
          dag = dag_module.dag
          print(f'DAG parsed OK — id: {dag.dag_id}, tasks: {len(dag.tasks)}')
          for t in dag.tasks:
              print(f'  {t.task_id}')
          "

      - name: Run unit tests
        working-directory: data_pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/data_pipeline
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_PATH: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          python -m pytest \
            tests/bias/ \
            tests/database/ \
            tests/features/ \
            tests/ingestion/ \
            tests/preprocess/ \
            tests/validation/ \
            -v --tb=short --cov=dags/src --cov-report=term-missing

  # ===========================================================================
  # JOB 2 — DB Connection Check
  # ===========================================================================
  db-connection-check:
    name: DB Connection Check
    runs-on: ubuntu-latest
    needs: unit-tests

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -so cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy "${{ secrets.DB_INSTANCE_CONNECTION_NAME }}" \
            --port 5432 &
          sleep 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary

      - name: Check DB connection
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, sys
          import urllib.parse
          if not os.getenv("DB_HOST"):
              print("No DB_HOST configured — skipping DB connection check.")
              sys.exit(0)
          try:
              from sqlalchemy import create_engine, text
              user = urllib.parse.quote_plus(os.environ['DB_USER'])
              password = urllib.parse.quote_plus(os.environ['DB_PASSWORD'])
              url = f"postgresql://{user}:{password}@{os.environ['DB_HOST']}:{os.environ.get('DB_PORT', '5432')}/{os.environ['DB_NAME']}"
              engine = create_engine(url)
              with engine.connect() as conn:
                  result = conn.execute(text("SELECT 1"))
                  print(f"DB connection OK: {result.scalar()}")
          except Exception as e:
              print(f"DB connection FAILED: {e}")
              print("Hint: Check DB_HOST / DB_USER GitHub Secrets are set correctly.")
              print("Note: If using Supabase, you may need an IPv4 connection pooler.")
              sys.exit(1)
          EOF

  # ===========================================================================
  # JOB 3 — Deploy DAGs to VM (main branch only)
  # ===========================================================================
  deploy-dags:
    name: Deploy DAGs to Airflow VM
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and update DAGs on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: github-actions
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/savvio
            git pull origin main
            docker compose exec -T airflow-apiserver airflow dags reserialize
            echo "DAGs reserialised successfully"

  # ===========================================================================
  # JOB 4 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Data Pipeline CI/CD FAILED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

  # ===========================================================================
  # JOB 5 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check]
    if: success()

    steps:
      - name: Send success notification
        run: |
          echo "Data Pipeline CI/CD PASSED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
