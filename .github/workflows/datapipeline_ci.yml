name: Data Pipeline CI/CD

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: data_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          pip install -e .
          if [ -f data-requirements.txt ]; then pip install -r data-requirements.txt; fi
          pip install pytest pytest-cov

      - name: Download raw data from GCS
        working-directory: data_pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_PATH: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          PYTHONPATH: dags/src:dags
        run: |
          python -c "from ingestion.run_ingestion import run_ingestion; run_ingestion()"

      - name: Run unit tests
        working-directory: data_pipeline
        env:
          PYTHONPATH: dags/src:dags
        run: |
          python -m pytest \
            tests/bias/ \
            tests/features/ \
            tests/ingestion/ \
            tests/preprocess/ \
            tests/validation/ \
            -v --tb=short

  # ===========================================================================
  # JOB 2 — DB Connection Check
  # ===========================================================================
  db-connection-check:
    name: DB Connection Check
    runs-on: ubuntu-latest
    needs: unit-tests

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary

      - name: Check DB connection
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, sys
          if not os.getenv("DB_HOST"):
              print("No DB_HOST configured — skipping DB connection check.")
              sys.exit(0)
          try:
              from sqlalchemy import create_engine, text
              url = f"postgresql://{os.environ['DB_USER']}:{os.environ['DB_PASSWORD']}@{os.environ['DB_HOST']}:{os.environ.get('DB_PORT', '5432')}/{os.environ['DB_NAME']}"
              engine = create_engine(url)
              with engine.connect() as conn:
                  result = conn.execute(text("SELECT 1"))
                  print(f"DB connection OK: {result.scalar()}")
          except Exception as e:
              print(f"DB connection FAILED: {e}")
              sys.exit(1)
          EOF

  # ===========================================================================
  # JOB 3 — Data Quality Check
  # ===========================================================================
  data-quality-check:
    name: Data Quality Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: data_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          if [ -f data-requirements.txt ]; then pip install -r data-requirements.txt; fi
          pip install pytest

      - name: Run data validation tests
        working-directory: data_pipeline
        run: |
          python -m pytest tests/validation/ -v --tb=short

  # ===========================================================================
  # JOB 4 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check, data-quality-check]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Data Pipeline CI/CD FAILED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

  # ===========================================================================
  # JOB 5 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check, data-quality-check]
    if: success()

    steps:
      - name: Send success notification
        run: |
          echo "Data Pipeline CI/CD PASSED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"