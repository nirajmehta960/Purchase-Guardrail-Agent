name: Data Pipeline CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data_pipeline/**'
      - 'savviocore/**'
  pull_request:
    branches: [main]
    paths:
      - 'data_pipeline/**'
      - 'savviocore/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/savvio-dev-docker-repo/savvio-data-pipeline

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: data_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          pip install -r tests/test_requirements.txt

      - name: Run unit tests
        working-directory: data_pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/data_pipeline
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python -m pytest \
            tests/bias/ \
            tests/database/ \
            tests/features/ \
            tests/ingestion/ \
            tests/preprocess/ \
            tests/validation/ \
            -v --tb=short --cov=dags/src --cov-report=term-missing

  # ===========================================================================
  # JOB 2 — Build & Push Image to Artifact Registry (main only)
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f data_pipeline/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            --push .

  # ===========================================================================
  # JOB 3 — Deploy to VM (main only, pull pre-built image)
  # ===========================================================================
  deploy:
    name: Deploy to Airflow VM
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy new image on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: github-actions
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 15m
          envs: IMAGE,GITHUB_SHA
          script: |
            cd /opt/savvio/data_pipeline

            cat > docker-compose.ci.yml <<EOF
            services:
              airflow-apiserver:
                image: $IMAGE:$GITHUB_SHA
              airflow-scheduler:
                image: $IMAGE:$GITHUB_SHA
              airflow-dag-processor:
                image: $IMAGE:$GITHUB_SHA
              airflow-worker:
                image: $IMAGE:$GITHUB_SHA
              airflow-triggerer:
                image: $IMAGE:$GITHUB_SHA
              airflow-init:
                image: $IMAGE:$GITHUB_SHA
              airflow-cli:
                image: $IMAGE:$GITHUB_SHA
              flower:
                image: $IMAGE:$GITHUB_SHA
            EOF

            sudo docker compose -f docker-compose.yaml -f docker-compose.ci.yml pull airflow-apiserver
            sudo docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d --remove-orphans
            echo "Deployed $IMAGE:$GITHUB_SHA"
        env:
          IMAGE: ${{ env.IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
