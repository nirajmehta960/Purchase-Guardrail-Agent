name: Deployment CI/CD

on:
  push:
    branches: [main]
    paths:
      - "deployment/api/**"
      - "deployment/frontend/src/**"
      - "deployment/frontend/package.json"
      - "deployment/mlflow/**"
      - "deployment/requirements.txt"
      - "deployment/__init__.py"
      - "savviocore/**"
      - "model_pipeline/src/**"
      - "model_pipeline/models/model/**"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev
  REGION: us-east1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # Tests (parallel)
  # ---------------------------------------------------------------------------
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-deployment-${{ hashFiles('deployment/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-deployment-

      - name: Install dependencies
        run: |
          pip install -e savviocore
          pip install -r deployment/requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          PYTHONPATH: "${{ github.workspace }}/model_pipeline/src:${{ github.workspace }}/savviocore/src:${{ github.workspace }}"
        run: python -m pytest deployment/tests/ -v --tb=short

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: deployment/frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: deployment/frontend
        run: bun run lint

      - name: Run tests
        working-directory: deployment/frontend
        run: bun run test

  # ---------------------------------------------------------------------------
  # Build & push (parallel, after respective test passes)
  # ---------------------------------------------------------------------------
  build-push-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-api
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment/api/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push .

  build-push-mlflow:
    name: Build & Push MLflow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-mlflow
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment/mlflow/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push deployment/mlflow/

  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment/frontend/Dockerfile \
            --build-arg VITE_API_BASE=${{ secrets.API_URL_DEV }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push deployment/frontend/

  # ---------------------------------------------------------------------------
  # Deploy to Cloud Run (after both builds pass)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-push-api, build-push-frontend, build-push-mlflow]

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-api
        run: |
          gcloud run deploy savvio-${{ env.ENVIRONMENT }}-api \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Deploy Frontend
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-frontend
        run: |
          gcloud run deploy savvio-${{ env.ENVIRONMENT }}-frontend \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --port 8080 \
            --quiet

      - name: Deploy MLflow
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-mlflow
        run: |
          gcloud run deploy savvio-${{ env.ENVIRONMENT }}-mlflow \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --port 5000 \
            --add-cloudsql-instances ${{ secrets.DB_INSTANCE_CONNECTION_NAME }} \
            --quiet

      - name: Verify API health
        run: |
          API_URL=$(gcloud run services describe savvio-${{ env.ENVIRONMENT }}-api \
            --region ${{ env.REGION }} --format='value(status.url)')
          echo "API: $API_URL"
          curl -sf "$API_URL/health" || { echo "ERROR: health check failed"; exit 1; }

  # ---------------------------------------------------------------------------
  # Drift Detection (runs after deploy)
  # ---------------------------------------------------------------------------
  drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-drift-evidently-0.7.20
          restore-keys: |
            ${{ runner.os }}-pip-drift-

      - name: Install dependencies
        run: |
          pip install evidently==0.7.20 pandas numpy scikit-learn pyyaml python-dotenv requests
          pip install sqlalchemy psycopg2-binary
          pip install -e savviocore

      - name: Cache Cloud SQL Auth Proxy
        id: cache-proxy
        uses: actions/cache@v4
        with:
          path: cloud-sql-proxy
          key: cloud-sql-proxy-v2.14.1-linux-amd64

      - name: Download Cloud SQL Auth Proxy
        if: steps.cache-proxy.outputs.cache-hit != 'true'
        run: |
          curl -so cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Start Cloud SQL Auth Proxy
        run: |
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${{ secrets.DB_INSTANCE_CONNECTION_NAME }}" --port 5432 &
          sleep 3

      - name: Run drift detector
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PYTHONPATH: "${{ github.workspace }}/deployment/monitoring/drift:${{ github.workspace }}/savviocore/src:${{ github.workspace }}"
        run: |
          python deployment/monitoring/drift/drift_detector.py

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: deployment/monitoring/reports/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Deploy Monitoring (Prometheus on GCE VM → remote-write to Grafana Cloud)
  # ---------------------------------------------------------------------------
  deploy-monitoring:
    name: Deploy Monitoring
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get API host for Prometheus scrape target
        id: api
        run: |
          API_URL=$(gcloud run services describe savvio-${{ env.ENVIRONMENT }}-api \
            --region ${{ env.REGION }} --format='value(status.url)')
          # Strip https:// — Prometheus target uses scheme: https
          echo "host=$(echo $API_URL | sed 's|https://||')" >> $GITHUB_OUTPUT

      - name: Render Prometheus production config
        env:
          API_HOST: ${{ steps.api.outputs.host }}
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_CLOUD_USERNAME: ${{ secrets.GRAFANA_CLOUD_USERNAME }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
        run: |
          envsubst < deployment/monitoring/prometheus/prometheus.production.yml \
            > /tmp/prometheus.rendered.yml

      - name: Get VM zone
        id: vm
        run: |
          ZONE=$(gcloud compute instances list \
            --filter="name=savvio-${{ env.ENVIRONMENT }}-pipeline-vm" \
            --format='value(zone)')
          echo "zone=$ZONE" >> $GITHUB_OUTPUT

      - name: Copy monitoring files to VM
        run: |
          gcloud compute scp /tmp/prometheus.rendered.yml \
            savvio-${{ env.ENVIRONMENT }}-pipeline-vm:/tmp/prometheus.yml \
            --zone=${{ steps.vm.outputs.zone }} --tunnel-through-iap --quiet

          gcloud compute scp deployment/monitoring/docker-compose.production.yml \
            savvio-${{ env.ENVIRONMENT }}-pipeline-vm:/tmp/docker-compose.monitoring.yml \
            --zone=${{ steps.vm.outputs.zone }} --tunnel-through-iap --quiet

      - name: Deploy Prometheus on VM
        run: |
          gcloud compute ssh savvio-${{ env.ENVIRONMENT }}-pipeline-vm \
            --zone=${{ steps.vm.outputs.zone }} --tunnel-through-iap --quiet \
            --command="
              sudo mkdir -p /opt/savvio-monitoring/prometheus &&
              sudo mv /tmp/prometheus.yml /opt/savvio-monitoring/prometheus/prometheus.yml &&
              sudo mv /tmp/docker-compose.monitoring.yml /opt/savvio-monitoring/docker-compose.yml &&
              cd /opt/savvio-monitoring &&
              sudo docker compose pull &&
              sudo docker compose up -d --remove-orphans
            "

  # ---------------------------------------------------------------------------
  # Notifications (covers all jobs)
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, build-push-mlflow, deploy, drift-detection, deploy-monitoring]
    if: failure()
    steps:
      - run: |
          echo "Deployment CI/CD FAILED — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"

  notify-on-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, build-push-mlflow, deploy, drift-detection, deploy-monitoring]
    if: success()
    steps:
      - run: |
          echo "Deployment CI/CD PASSED — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
