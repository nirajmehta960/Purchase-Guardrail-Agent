name: Deployment CI/CD

# Triggers:
#   - push to main on app/library code paths (excluding model_pipeline:
#     model retraining is handled by modelpipeline_ci.yml, which dispatches
#     this workflow on success — avoids double-fires for the same SHA).
#   - workflow_dispatch (used by modelpipeline_ci.yml's trigger-deployment
#     job and by ops-monitoring.yml's RED-drift retraining flow indirectly).
on:
  push:
    branches: [main]
    paths:
      - "deployment/api/**"
      - "deployment/frontend/src/**"
      - "deployment/frontend/package.json"
      - "deployment/mlflow/**"
      - "deployment/requirements.txt"
      - "deployment/__init__.py"
      - "savviocore/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  ENVIRONMENT: dev
  REGION: us-east1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # ===========================================================================
  # Testing Phase
  # ===========================================================================
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-deployment-${{ hashFiles('deployment/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-deployment-

      - name: Install dependencies
        run: |
          pip install -e savviocore
          pip install -r deployment/requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          PYTHONPATH: "${{ github.workspace }}/model_pipeline/src:${{ github.workspace }}/savviocore/src:${{ github.workspace }}"
        run: python -m pytest deployment/tests/ -v --tb=short

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: deployment/frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: deployment/frontend
        run: bun run lint

      - name: Run tests
        working-directory: deployment/frontend
        run: bun run test

  # ===========================================================================
  # Artifact Build & Registry Push
  # ===========================================================================
  build-push-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-api
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment/api/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push .

  build-push-mlflow:
    name: Build & Push MLflow
    runs-on: ubuntu-latest
    # Gated on test-api so mlflow image is not built when API tests fail
    # (previously had no needs:, so it built on any push regardless of tests).
    needs: test-api

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-mlflow
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment/mlflow/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push deployment/mlflow/

  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment/frontend/Dockerfile \
            --build-arg VITE_API_BASE=${{ secrets.API_URL_DEV }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push deployment/frontend/

  # ===========================================================================
  # Production Deployment
  # ===========================================================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-push-api, build-push-frontend, build-push-mlflow]

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-api
        run: |
          gcloud run deploy savvio-backend-api \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Deploy Frontend
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-frontend
        run: |
          gcloud run deploy savvio-ai \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Deploy MLflow
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-mlflow
        run: |
          gcloud run deploy savvio-ai-mlflow \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Verify API health
        run: |
          API_URL=$(gcloud run services describe savvio-backend-api \
            --region ${{ env.REGION }} --format='value(status.url)')
          echo "API: $API_URL"
          curl -sf "$API_URL/health" || { echo "ERROR: health check failed"; exit 1; }

  # ---------------------------------------------------------------------------
  # Notifications (covers all jobs) — sent via SMTP to ALERT_EMAIL_LIST.
  # if: always() ensures these run even if upstream jobs are skipped.
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, build-push-mlflow, deploy]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Log failure summary
        run: |
          echo "Deployment CI/CD FAILED — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: SavVio CI <${{ secrets.ALERT_EMAIL_FROM }}>
          to: ${{ secrets.ALERT_EMAIL_LIST }}
          subject: "[SavVio][FAILED] Deployment CI/CD — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          body: |
            Deployment CI/CD FAILED

            Environment:  ${{ env.ENVIRONMENT }}
            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Event:        ${{ github.event_name }}

            Per-job results:
              test-api:            ${{ needs.test-api.result }}
              test-frontend:       ${{ needs.test-frontend.result }}
              build-push-api:      ${{ needs.build-push-api.result }}
              build-push-frontend: ${{ needs.build-push-frontend.result }}
              build-push-mlflow:   ${{ needs.build-push-mlflow.result }}
              deploy:              ${{ needs.deploy.result }}

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-on-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, build-push-mlflow, deploy]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - name: Log success summary
        run: |
          echo "Deployment CI/CD PASSED — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: SavVio CI <${{ secrets.ALERT_EMAIL_FROM }}>
          to: ${{ secrets.ALERT_EMAIL_LIST }}
          subject: "[SavVio][OK] Deployment CI/CD — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          body: |
            Deployment CI/CD PASSED

            Environment:  ${{ env.ENVIRONMENT }}
            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            API, Frontend, and MLflow images deployed to Cloud Run.

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
