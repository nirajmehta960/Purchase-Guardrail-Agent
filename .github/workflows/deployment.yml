name: Deployment CI/CD

on:
  push:
    branches: [main]
    paths:
      - "deployment_pipeline/api/**"
      - "deployment_pipeline/frontend/src/**"
      - "deployment_pipeline/frontend/package.json"
      - "deployment_pipeline/mlflow/**"
      - "deployment_pipeline/requirements.txt"
      - "deployment_pipeline/__init__.py"
      - "savviocore/**"
      - "model_pipeline/src/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev
  REGION: us-east1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # ===========================================================================
  # JOB 1 — Tests
  # ===========================================================================
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e savviocore
          pip install -r deployment_pipeline/requirements.txt

      - name: Run tests
        working-directory: deployment_pipeline
        run: python -m pytest deployment_pipeline/tests/ -v --tb=short

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: deployment_pipeline/frontend
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: deployment_pipeline/frontend
        run: bun run test
  # ===========================================================================
  # JOB 2 — Build & Push Image to Artifact Registry (main only)
  # ===========================================================================
  build-push-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-api
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment_pipeline/api/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push .

  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f deployment_pipeline/frontend/Dockerfile \
            --build-arg VITE_API_BASE=${{ secrets.API_URL_DEV }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push deployment_pipeline/frontend/

  # ===========================================================================
  # JOB 3 — Deploy to Cloud Run (Terraform-managed service)
  # ===========================================================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-push-api, build-push-frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-api
        run: |
          gcloud run deploy savvio-backend-api \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Deploy Frontend
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-frontend
        run: |
          gcloud run deploy savvio-ai \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Verify API health
        run: |
          API_URL=$(gcloud run services describe savvio-backend-api \
            --region ${{ env.REGION }} --format='value(status.url)')
          echo "API: $API_URL"
          curl -sf "$API_URL/health" || { echo "ERROR: health check failed"; exit 1; }

  # ---------------------------------------------------------------------------
  # Notifications (covers all jobs)
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, deploy]
    if: failure()
    steps:
      - run: |
          echo "Deployment CI/CD FAILED — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"

  notify-on-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, deploy]
    if: success()
    steps:
      - run: |
          echo "Deployment CI/CD PASSED — ${{ env.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
