name: Deployment CI/CD

on:
  push:
    branches: [main]
    paths:
      - "deployment/api/**"
      - "deployment/frontend/src/**"
      - "deployment/frontend/package.json"
      - "deployment/mlflow/**"
      - "deployment/requirements.txt"
      - "deployment/__init__.py"
      - "savviocore/**"
      - ".github/workflows/deployment.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  IMAGE_BASE: ${{ vars.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}

jobs:
  # ===========================================================================
  # JOB 1 — API Tests
  # ===========================================================================
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: deployment/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e savviocore
          pip install -r deployment/requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          PYTHONPATH: "${{ github.workspace }}/model_pipeline/src:${{ github.workspace }}/savviocore/src:${{ github.workspace }}"
        run: python -m pytest deployment/tests/ -v --tb=short

  # ===========================================================================
  # JOB 2 — Frontend Tests
  # ===========================================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: deployment/frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: deployment/frontend
        run: bun run lint

      - name: Run tests
        working-directory: deployment/frontend
        run: bun run test

  # ===========================================================================
  # JOB 3 — Build & Push API Image
  # ===========================================================================
  build-push-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_API }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_API }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_API }}:buildcache,mode=max

  # ===========================================================================
  # JOB 4 — Build & Push MLflow Image
  # ===========================================================================
  build-push-mlflow:
    name: Build & Push MLflow
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: deployment/mlflow
          file: deployment/mlflow/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_MLFLOW }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_MLFLOW }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_MLFLOW }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_MLFLOW }}:buildcache,mode=max

  # ===========================================================================
  # JOB 5 — Build & Push Frontend Image
  # ===========================================================================
  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: deployment/frontend
          file: deployment/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.API_URL_DEV }}
            VITE_DEFAULT_USER_ID=${{ vars.VITE_DEFAULT_USER_ID }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_FRONTEND }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_FRONTEND }}:buildcache,mode=max

  # ===========================================================================
  # JOB 6 — Deploy to Cloud Run (Terraform-managed services)
  # ===========================================================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-push-api, build-push-frontend, build-push-mlflow]

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_API }}" \
            --image "${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_API }}:${{ github.sha }}" \
            --region "${{ vars.AR_REGION }}" \
            --quiet

      - name: Deploy Frontend
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_FRONTEND }}" \
            --image "${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_FRONTEND }}:${{ github.sha }}" \
            --region "${{ vars.AR_REGION }}" \
            --quiet

      - name: Deploy MLflow
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_MLFLOW }}" \
            --image "${{ env.IMAGE_BASE }}/${{ vars.AR_IMAGE_MLFLOW }}:${{ github.sha }}" \
            --region "${{ vars.AR_REGION }}" \
            --quiet

      - name: Verify API health
        run: |
          API_URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_API }}" \
            --region "${{ vars.AR_REGION }}" --format='value(status.url)')
          echo "API: $API_URL"
          curl -sf "$API_URL/health" || { echo "ERROR: health check failed"; exit 1; }

  # ===========================================================================
  # JOB 7 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, build-push-mlflow, deploy]
    if: always() && contains(needs.*.result, 'failure')

    steps:
      - name: Log failure summary
        run: |
          echo "Deployment CI/CD FAILED — ${{ vars.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send failure email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ vars.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ vars.ALERT_EMAIL_FROM }}>
          to: ${{ vars.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][FAILED] Deployment CI/CD — ${{ vars.ENVIRONMENT }} — ${{ github.sha }}"
          body: |
            Deployment CI/CD FAILED

            Environment:  ${{ vars.ENVIRONMENT }}
            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Event:        ${{ github.event_name }}

            Per-job results:
              test-api:            ${{ needs.test-api.result }}
              test-frontend:       ${{ needs.test-frontend.result }}
              build-push-api:      ${{ needs.build-push-api.result }}
              build-push-frontend: ${{ needs.build-push-frontend.result }}
              build-push-mlflow:   ${{ needs.build-push-mlflow.result }}
              deploy:              ${{ needs.deploy.result }}

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ===========================================================================
  # JOB 8 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, build-push-api, build-push-frontend, build-push-mlflow, deploy]
    if: |
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')

    steps:
      - name: Log success summary
        run: |
          echo "Deployment CI/CD PASSED — ${{ vars.ENVIRONMENT }} — ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Send success email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ vars.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ vars.ALERT_EMAIL_FROM }}>
          to: ${{ vars.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][OK] Deployment CI/CD — ${{ vars.ENVIRONMENT }} — ${{ github.sha }}"
          body: |
            Deployment CI/CD PASSED

            Environment:  ${{ vars.ENVIRONMENT }}
            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            API, Frontend and MLflow images deployed to Cloud Run.

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
