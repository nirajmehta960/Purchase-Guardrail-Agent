name: Model Pipeline CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
      - '.github/workflows/modelpipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
      - '.github/workflows/modelpipeline.yml'
  workflow_dispatch:
    inputs:
      skip_rollback_check:
        description: 'Skip rollback check (use for first run or manual override)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_bias_gate:
        description: 'Skip bias gate (use for debugging only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  IMAGE: ${{ vars.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/${{ vars.AR_IMAGE_MODELPIPELINE }}

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model_pipeline/requirements.txt

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ../savviocore
          pip install -e .
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: model_pipeline
        run: |
          python -m pytest \
            tests/data/test_data_loader.py \
            tests/data/test_validate_data.py \
            tests/deterministic_engine/test_downgrade_engine.py \
            tests/deterministic_engine/test_financial_engine.py \
            tests/deterministic_engine/test_labeling_pipeline.py \
            tests/features/test_feature_engineering.py \
            tests/features/test_feature_preprocessing.py \
            tests/features/test_financial_features.py \
            tests/features/test_product_features.py \
            tests/features/test_review_features.py \
            tests/guards/test_bias_detection.py \
            -v --tb=short

  # ===========================================================================
  # JOB 2 — Run Model Pipeline
  # ===========================================================================
  run-pipeline:
    name: Run Model Pipeline
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache Cloud SQL Auth Proxy
        id: cache-proxy
        uses: actions/cache@v4
        with:
          path: cloud-sql-proxy
          key: cloud-sql-proxy-v2.14.1-linux-amd64

      - name: Download Cloud SQL Auth Proxy
        if: steps.cache-proxy.outputs.cache-hit != 'true'
        run: |
          curl -so cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy "${{ secrets.DB_INSTANCE_CONNECTION_NAME }}" --port 5432 &
          sleep 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model_pipeline/requirements.txt

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ../savviocore
          pip install -e .
          pip install -r requirements.txt

      - name: Download previous metrics from GCS (rollback baseline)
        run: |
          gcloud storage cp \
            gs://${{ vars.MLFLOW_GCS_BUCKET }}/ci/previous_metrics.txt \
            model_pipeline/previous_metrics.txt \
            || echo "No previous metrics found — first run, skipping rollback baseline."

      - name: Resolve MLflow tracking URI
        run: |
          MLFLOW_URL=$(gcloud run services describe ${{ vars.CLOUD_RUN_MLFLOW }} \
            --region ${{ vars.AR_REGION }} --format='value(status.url)')
          echo "MLFLOW_TRACKING_URI=${MLFLOW_URL}" >> $GITHUB_ENV

      - name: Run pipeline
        working-directory: model_pipeline
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.AR_REGION }}
        run: python src/run_pipeline.py

      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: |
            model_pipeline/metrics.txt
            model_pipeline/bias_metrics.txt
            model_pipeline/previous_metrics.txt
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # JOB 3 — Validation Gate (parallel with bias-gate)
  # ===========================================================================
  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    needs: run-pipeline

    steps:
      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Check validation thresholds
        env:
          F1_THRESHOLD: ${{ vars.F1_THRESHOLD }}
          ROC_AUC_THRESHOLD: ${{ vars.ROC_AUC_THRESHOLD }}
        run: |
          python3 - <<'EOF'
          import os, sys

          metrics_file = "model_pipeline/metrics.txt"
          if not os.path.exists(metrics_file):
              print("No metrics file found — pipeline did not produce metrics.txt. Failing.")
              sys.exit(1)

          metrics = {}
          with open(metrics_file) as f:
              for line in f:
                  k, v = line.strip().split("=")
                  metrics[k.strip()] = float(v.strip())

          f1         = metrics.get("f1_score", 0.0)
          roc_auc    = metrics.get("roc_auc", 0.0)
          f1_thresh  = float(os.environ["F1_THRESHOLD"])
          roc_thresh = float(os.environ["ROC_AUC_THRESHOLD"])

          print(f"F1 Score: {f1:.4f} (threshold: >{f1_thresh})")
          print(f"ROC AUC:  {roc_auc:.4f} (threshold: >{roc_thresh})")

          failed = []
          if f1 < f1_thresh:
              failed.append(f"F1 {f1:.4f} < {f1_thresh}")
          if roc_auc < roc_thresh:
              failed.append(f"ROC AUC {roc_auc:.4f} < {roc_thresh}")

          if failed:
              print(f"VALIDATION GATE FAILED: {', '.join(failed)}")
              sys.exit(1)
          print("VALIDATION GATE PASSED")
          EOF

  # ===========================================================================
  # JOB 4 — Bias Detection Gate (parallel with validation-gate)
  # ===========================================================================
  bias-gate:
    name: Bias Detection Gate
    runs-on: ubuntu-latest
    needs: run-pipeline

    steps:
      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Check bias thresholds
        env:
          SKIP_BIAS_GATE: ${{ github.event.inputs.skip_bias_gate || 'false' }}
        run: |
          python3 - <<'EOF'
          import os, sys

          if os.environ.get("SKIP_BIAS_GATE", "false").lower() == "true":
              print("BIAS GATE SKIPPED (manual override via workflow_dispatch input)")
              sys.exit(0)

          bias_file = "model_pipeline/bias_metrics.txt"
          if not os.path.exists(bias_file):
              print("No bias metrics file found — pipeline did not produce bias_metrics.txt. Failing.")
              sys.exit(1)

          metrics = {}
          with open(bias_file) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  k, v = line.split("=", 1)
                  metrics[k.strip()] = v.strip()

          if int(metrics.get("bias_gate_passed", "0")):
              print("BIAS GATE PASSED")
          else:
              print("BIAS GATE FAILED — see run-pipeline logs for which slices violated thresholds")
              sys.exit(1)
          EOF

  # ===========================================================================
  # JOB 5 — Rollback Check
  # ===========================================================================
  rollback-check:
    name: Rollback Check
    runs-on: ubuntu-latest
    needs: [validation-gate, bias-gate]

    steps:
      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Check rollback threshold
        env:
          ROLLBACK_THRESHOLD: ${{ vars.ROLLBACK_THRESHOLD }}
          SKIP_ROLLBACK: ${{ github.event.inputs.skip_rollback_check || 'false' }}
        run: |
          python3 - <<'EOF'
          import os, sys

          if os.environ.get("SKIP_ROLLBACK", "false").lower() == "true":
              print("ROLLBACK CHECK SKIPPED (manual override via workflow_dispatch input)")
              sys.exit(0)

          current_file  = "model_pipeline/metrics.txt"
          previous_file = "model_pipeline/previous_metrics.txt"

          if not os.path.exists(previous_file):
              print("No previous_metrics.txt — first run or baseline not yet established. Skipping rollback check.")
              sys.exit(0)

          def read_metrics(path):
              m = {}
              with open(path) as f:
                  for line in f:
                      k, v = line.strip().split("=")
                      m[k.strip()] = float(v.strip())
              return m

          current   = read_metrics(current_file)
          previous  = read_metrics(previous_file)
          curr_f1   = current.get("f1_score", 0.0)
          prev_f1   = previous.get("f1_score", 0.0)
          threshold = float(os.environ["ROLLBACK_THRESHOLD"])
          drop      = prev_f1 - curr_f1

          print(f"Previous F1: {prev_f1:.4f}")
          print(f"Current F1:  {curr_f1:.4f}")
          print(f"Drop:        {drop:.4f} (max allowed: {threshold})")

          if drop > threshold:
              print(f"ROLLBACK CHECK FAILED — F1 dropped by {drop:.4f}")
              sys.exit(1)
          print("ROLLBACK CHECK PASSED")
          EOF

  # ===========================================================================
  # JOB 6 — Persist Metrics Baseline to GCS (main only)
  # ===========================================================================
  persist-metrics-baseline:
    name: Persist Metrics Baseline
    runs-on: ubuntu-latest
    needs: rollback-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Push current metrics to GCS as new baseline
        run: |
          gcloud storage cp model_pipeline/metrics.txt \
            gs://${{ vars.MLFLOW_GCS_BUCKET }}/ci/previous_metrics.txt
          echo "Baseline updated in GCS."

  # ===========================================================================
  # JOB 7 — Build & Push Trainer Image (main only)
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: persist-metrics-baseline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: model_pipeline
          file: model_pipeline/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # ===========================================================================
  # JOB 8 — Deploy Trainer to Cloud Run (Terraform-managed service)
  # ===========================================================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy image to Cloud Run Job
        run: |
          gcloud run jobs deploy "${{ vars.CLOUD_RUN_ML_TRAINER }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.AR_REGION }}" \
            --image "${{ steps.tag.outputs.image_tag }}" \
            --service-account "${{ vars.RUN_SA_EMAIL }}" \
            --quiet

  # ===========================================================================
  # JOB 9 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, run-pipeline, validation-gate, bias-gate, rollback-check, persist-metrics-baseline, build-and-push, deploy]
    if: always() && contains(needs.*.result, 'failure')

    steps:
      - name: Log failure summary
        run: |
          echo "Model Pipeline CI/CD FAILED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send failure email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ vars.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ vars.ALERT_EMAIL_FROM }}>
          to: ${{ vars.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][FAILED] Model Pipeline CI/CD — ${{ github.ref_name }} @ ${{ github.sha }}"
          body: |
            Model Pipeline CI/CD FAILED

            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Event:        ${{ github.event_name }}

            Per-job results:
              unit-tests:               ${{ needs.unit-tests.result }}
              run-pipeline:             ${{ needs.run-pipeline.result }}
              validation-gate:          ${{ needs.validation-gate.result }}
              bias-gate:                ${{ needs.bias-gate.result }}
              rollback-check:           ${{ needs.rollback-check.result }}
              persist-metrics-baseline: ${{ needs.persist-metrics-baseline.result }}
              build-and-push:           ${{ needs.build-and-push.result }}
              deploy:                   ${{ needs.deploy.result }}

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ===========================================================================
  # JOB 10 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [unit-tests, run-pipeline, validation-gate, bias-gate, rollback-check, persist-metrics-baseline, build-and-push, deploy]
    if: |
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'

    steps:
      - name: Log success summary
        run: |
          echo "Model Pipeline CI/CD PASSED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"

      - name: Send success email
        if: vars.NOTIFY_EMAILS_ENABLED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ vars.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.PROJECT_NAME }} CI <${{ vars.ALERT_EMAIL_FROM }}>
          to: ${{ vars.ALERT_EMAIL_LIST }}
          subject: "[${{ vars.PROJECT_NAME }}][OK] Model Pipeline CI/CD — ${{ github.ref_name }} @ ${{ github.sha }}"
          body: |
            Model Pipeline CI/CD PASSED

            Branch:       ${{ github.ref_name }}
            Commit:       ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Validation gate, bias gate and rollback check all passed.
            New metrics baseline persisted; trainer image deployed to Cloud Run.

            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
