name: Model Pipeline CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
  pull_request:
    branches: [main]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
  workflow_dispatch:
    inputs:
      skip_rollback_check:
        description: 'Skip rollback check (use for first run or manual override)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_bias_gate:
        description: 'Skip bias gate (use for debugging only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/savvio-dev-docker-repo/savvio-model-pipeline
  # Terraform creates this Cloud Run service.
  CLOUD_RUN_SERVICE: savvio-ai

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          pip install -e .
          pip install -r model-requirements.txt

      - name: Run unit tests
        working-directory: model_pipeline
        run: |
          python -m pytest \
            tests/ \
            -v --tb=short

  # ===========================================================================
  # JOB 2 — Build & Push Image via Docker Compose
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push with Docker Compose
        run: |
          docker buildx bake \
            -f model_pipeline/docker-compose.yml \
            ml-trainer \
            --set ml-trainer.platform=linux/amd64,linux/arm64 \
            --set ml-trainer.tags=${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest \
            --push

  # ===========================================================================
  # JOB 3 — Deploy to Cloud Run (Terraform-managed service)
  # ===========================================================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy image to Cloud Run service created by Terraform
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --service-account "savvio-${{ env.ENVIRONMENT }}-run-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --quiet

