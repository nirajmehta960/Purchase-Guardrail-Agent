name: Model Pipeline CI/CD

on:
  workflow_dispatch:  # Manual trigger only

env:
  ENVIRONMENT: dev
  REGION: us-east1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model_pipeline/model-requirements.txt

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          pip install --upgrade pip
          pip install -e .
          if [ -f model-requirements.txt ]; then pip install -r model-requirements.txt; fi
          pip install --force-reinstall "sqlalchemy>=2.0"

      - name: Run unit tests
        working-directory: model_pipeline
        run: |
          python -m pytest \
            tests/data/test_data_loader.py \
            tests/data/test_validate_data.py \
            tests/deterministic_engine/test_downgrade_engine.py \
            tests/deterministic_engine/test_financial_engine.py \
            tests/deterministic_engine/test_labeling_pipeline.py \
            tests/features/test_feature_engineering.py \
            tests/features/test_feature_preprocessing.py \
            tests/features/test_financial_features.py \
            tests/features/test_product_features.py \
            tests/features/test_review_features.py \
            tests/guards/test_bias_detection.py \
            -v --tb=short

  # ===========================================================================
  # JOB 2 — DB Connection Check
  # ===========================================================================
  db-connection-check:
    name: DB Connection Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary
          if [ -f model-requirements.txt ]; then pip install -r model-requirements.txt; fi

      - name: Fetch DB credentials from GCP
        id: db-creds
        run: |
          DB_HOST=$(gcloud sql instances describe savvio-${{ env.ENVIRONMENT }}-db-instance \
            --project=${{ env.PROJECT_ID }} \
            --format='value(ipAddresses[0].ipAddress)' 2>/dev/null || echo "")
          DB_PASSWORD=$(gcloud secrets versions access latest \
            --secret=savvio-${{ env.ENVIRONMENT }}-db-password \
            --project=${{ env.PROJECT_ID }} 2>/dev/null || echo "")
          echo "::add-mask::$DB_PASSWORD"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "db_password=$DB_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Check DB connection
        working-directory: model_pipeline
        env:
          DB_HOST: ${{ steps.db-creds.outputs.db_host }}
          DB_PORT: "5432"
          DB_NAME: savvio-${{ env.ENVIRONMENT }}-db
          DB_USER: ${{ env.ENVIRONMENT }}-db-admin
          DB_PASSWORD: ${{ steps.db-creds.outputs.db_password }}
        run: |
          python3 - <<'EOF'
          import os, sys
          if not os.getenv("DB_HOST"):
              print("No DB_HOST configured — skipping DB connection check.")
              sys.exit(0)
          try:
              from sqlalchemy import create_engine, text
              url = f"postgresql://{os.environ['DB_USER']}:{os.environ['DB_PASSWORD']}@{os.environ['DB_HOST']}:{os.environ.get('DB_PORT', '5432')}/{os.environ['DB_NAME']}"
              engine = create_engine(url)
              with engine.connect() as conn:
                  result = conn.execute(text("SELECT 1"))
                  print(f"DB connection OK: {result.scalar()}")
          except Exception as e:
              print(f"DB connection FAILED: {e}")
              sys.exit(1)
          EOF

  # ===========================================================================
  # JOB 3 — Build & Push Training Image, Execute Cloud Run Job
  # ===========================================================================
  run-training:
    name: Cloud Run Training Job
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check]

    outputs:
      f1_score: ${{ steps.parse-metrics.outputs.f1_score }}
      roc_auc: ${{ steps.parse-metrics.outputs.roc_auc }}
      bias_passed: ${{ steps.parse-metrics.outputs.bias_passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push training image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-training
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f model_pipeline/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push .

      - name: Update Cloud Run job with new image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/savvio-${{ env.ENVIRONMENT }}-docker-repo/savvio-training
          JOB_NAME: savvio-${{ env.ENVIRONMENT }}-training
        run: |
          # Update the job to use the new image (job must already exist via Terraform)
          gcloud run jobs update $JOB_NAME \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Execute Cloud Run training job
        env:
          JOB_NAME: savvio-${{ env.ENVIRONMENT }}-training
        run: |
          gcloud run jobs execute $JOB_NAME \
            --region ${{ env.REGION }} \
            --wait \
            --format="value(metadata.name)" | tee /tmp/execution_name.txt

      - name: Fetch training logs
        env:
          JOB_NAME: savvio-${{ env.ENVIRONMENT }}-training
        run: |
          EXECUTION=$(cat /tmp/execution_name.txt)
          # Give logs a moment to propagate
          sleep 10
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=$JOB_NAME AND labels.\"run.googleapis.com/execution_name\"=$EXECUTION" \
            --limit=500 \
            --format="value(textPayload)" \
            --project=${{ env.PROJECT_ID }} | tee /tmp/training_logs.txt

      - name: Parse metrics from logs
        id: parse-metrics
        run: |
          python3 - <<'PYEOF'
          import re, os

          metrics = {}
          with open("/tmp/training_logs.txt") as f:
              for line in f:
                  m = re.match(r"SAVVIO_METRIC::(\w+)=([\d.]+)", line.strip())
                  if m:
                      metrics[m.group(1)] = m.group(2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"f1_score={metrics.get('f1_score', '0.0')}\n")
              gh.write(f"roc_auc={metrics.get('roc_auc', '0.0')}\n")
              gh.write(f"bias_passed={metrics.get('bias_passed', '0')}\n")

          print("Parsed metrics:")
          for k, v in metrics.items():
              print(f"  {k} = {v}")
          PYEOF

  # ===========================================================================
  # JOB 4 — Validation Gate
  # ===========================================================================
  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    needs: run-training

    steps:
      - name: Check quality thresholds
        env:
          F1_SCORE: ${{ needs.run-training.outputs.f1_score }}
          ROC_AUC: ${{ needs.run-training.outputs.roc_auc }}
          BIAS_PASSED: ${{ needs.run-training.outputs.bias_passed }}
          F1_THRESHOLD: "0.70"
          ROC_AUC_THRESHOLD: "0.75"
          BIAS_THRESHOLD: "1"
        run: |
          python3 - <<'EOF'
          import os, sys

          f1       = float(os.environ.get("F1_SCORE", "0.0"))
          roc_auc  = float(os.environ.get("ROC_AUC", "0.0"))
          bias_ok  = os.environ.get("BIAS_PASSED", "0")
          f1_thresh  = float(os.environ["F1_THRESHOLD"])
          roc_thresh = float(os.environ["ROC_AUC_THRESHOLD"])

          print(f"F1 Score:     {f1:.4f}  (threshold: >{f1_thresh})")
          print(f"ROC AUC:      {roc_auc:.4f}  (threshold: >{roc_thresh})")
          print(f"Bias Passed:  {bias_ok}")

          failed = []
          if f1 < f1_thresh:
              failed.append(f"F1 {f1:.4f} < {f1_thresh}")
          if roc_auc < roc_thresh:
              failed.append(f"ROC AUC {roc_auc:.4f} < {roc_thresh}")
          if bias_ok != "1":
              failed.append(f"Bias gate did not pass (value={bias_ok})")

          if failed:
              print(f"VALIDATION GATE FAILED: {', '.join(failed)}")
              sys.exit(1)
          print("VALIDATION GATE PASSED")
          EOF

  # ===========================================================================
  # JOB 5 — Trigger Deployment (on success)
  # ===========================================================================
  trigger-deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: validation-gate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger deployment workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deployment.yml \
            --repo ${{ github.repository }} \
            --ref main

  # ===========================================================================
  # JOB 6 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check, run-training, validation-gate]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Model Pipeline CI/CD FAILED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

  # ===========================================================================
  # JOB 7 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check, run-training, validation-gate]
    if: success()

    steps:
      - name: Send success notification
        run: |
          echo "Model Pipeline CI/CD PASSED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
