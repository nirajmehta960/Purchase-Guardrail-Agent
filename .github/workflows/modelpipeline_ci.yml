name: Model Pipeline CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
  pull_request:
    branches: [main]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
  workflow_dispatch:
    inputs:
      skip_rollback_check:
        description: 'Skip rollback check (use for first run or manual override)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_bias_gate:
        description: 'Skip bias gate (use for debugging only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev
  CLOUD_SQL_PROXY_URL: https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          pip install -e .
          pip install -r model-requirements.txt

      - name: Run unit tests
        working-directory: model_pipeline
        run: |
          python -m pytest \
            tests/ \
            -v --tb=short

  # ===========================================================================
  # JOB 2 — Run Model Pipeline
  # ===========================================================================
  run-pipeline:
    name: Run Model Pipeline
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache Cloud SQL Auth Proxy
        id: cache-proxy
        uses: actions/cache@v4
        with:
          path: cloud-sql-proxy
          key: cloud-sql-proxy-v2.14.1-linux-amd64

      - name: Download Cloud SQL Auth Proxy
        if: steps.cache-proxy.outputs.cache-hit != 'true'
        run: |
          curl -so cloud-sql-proxy ${{ env.CLOUD_SQL_PROXY_URL }}
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${{ secrets.DB_INSTANCE_CONNECTION_NAME }}" --port 5432 &
          sleep 3

