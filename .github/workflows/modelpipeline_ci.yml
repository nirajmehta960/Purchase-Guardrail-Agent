name: Model Pipeline CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
  pull_request:
    branches: [main]
    paths:
      - 'model_pipeline/**'
      - 'savviocore/**'
  workflow_dispatch:

env:
  ENVIRONMENT: dev

jobs:
  # ===========================================================================
  # JOB 1 — Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-modelpipeline-${{ hashFiles('model_pipeline/model-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-modelpipeline-

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          pip install -e .
          if [ -f model-requirements.txt ]; then pip install -r model-requirements.txt; fi
          pip install --force-reinstall "sqlalchemy>=2.0"

      - name: Run unit tests
        working-directory: model_pipeline
        run: |
          python -m pytest \
            tests/data/test_data_loader.py \
            tests/data/test_validate_data.py \
            tests/deterministic_engine/test_downgrade_engine.py \
            tests/deterministic_engine/test_financial_engine.py \
            tests/deterministic_engine/test_labeling_pipeline.py \
            tests/features/test_feature_engineering.py \
            tests/features/test_feature_preprocessing.py \
            tests/features/test_financial_features.py \
            tests/features/test_product_features.py \
            tests/features/test_review_features.py \
            tests/guards/test_bias_detection.py \
            -v --tb=short

  # ===========================================================================
  # JOB 2 — DB Connection Check (parallel with unit tests)
  # ===========================================================================
  db-connection-check:
    name: DB Connection Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -so cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy "${{ secrets.DB_INSTANCE_CONNECTION_NAME }}" \
            --port 5432 &
          sleep 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary

      - name: Check DB connection
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, sys, urllib.parse
          if not os.getenv("DB_HOST"):
              print("No DB_HOST configured — skipping DB connection check.")
              sys.exit(0)
          try:
              from sqlalchemy import create_engine, text
              user = urllib.parse.quote_plus(os.environ['DB_USER'])
              password = urllib.parse.quote_plus(os.environ['DB_PASSWORD'])
              url = f"postgresql://{user}:{password}@{os.environ['DB_HOST']}:{os.environ.get('DB_PORT', '5432')}/{os.environ['DB_NAME']}"
              engine = create_engine(url)
              with engine.connect() as conn:
                  result = conn.execute(text("SELECT 1"))
                  print(f"DB connection OK: {result.scalar()}")
          except Exception as e:
              print(f"DB connection FAILED: {e}")
              sys.exit(1)
          EOF

  # ===========================================================================
  # JOB 3 — Run Model Pipeline
  # Writes metrics.txt and bias_metrics.txt, uploads as artifacts for gate jobs.
  # Downloads previous_metrics.txt from GCS for rollback baseline.
  # ===========================================================================
  run-pipeline:
    name: Run Model Pipeline
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -so cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy "${{ secrets.DB_INSTANCE_CONNECTION_NAME }}" \
            --port 5432 &
          sleep 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-modelpipeline-${{ hashFiles('model_pipeline/model-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-modelpipeline-

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          pip install --upgrade pip
          pip install -e ../savviocore
          pip install -e .
          if [ -f model-requirements.txt ]; then pip install -r model-requirements.txt; fi
          pip install --force-reinstall "sqlalchemy>=2.0"

      - name: Download previous metrics from GCS (rollback baseline)
        run: |
          gsutil cp gs://savvio-${{ env.ENVIRONMENT }}-mlflow-artifacts/ci/previous_metrics.txt \
            model_pipeline/previous_metrics.txt || echo "No previous metrics found — first run, skipping rollback baseline."

      - name: Start MLflow server
        run: |
          cd model_pipeline
          mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            --host 127.0.0.1 \
            --port 5000 &
          sleep 5

      - name: Run pipeline
        working-directory: model_pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python src/run_pipeline.py

      - name: Upload metrics artifacts (for gate jobs)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: |
            model_pipeline/metrics.txt
            model_pipeline/bias_metrics.txt
            model_pipeline/previous_metrics.txt
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # JOB 4 — Validation Gate
  # Blocks if F1 < 0.70 or ROC AUC < 0.75
  # ===========================================================================
  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    needs: run-pipeline

    steps:
      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Check validation thresholds
        env:
          F1_THRESHOLD: "0.70"
          ROC_AUC_THRESHOLD: "0.75"
        run: |
          python3 - <<'EOF'
          import os, sys

          metrics_file = "model_pipeline/metrics.txt"
          if not os.path.exists(metrics_file):
              print("No metrics file found — pipeline did not produce metrics.txt. Failing.")
              sys.exit(1)

          metrics = {}
          with open(metrics_file) as f:
              for line in f:
                  k, v = line.strip().split("=")
                  metrics[k.strip()] = float(v.strip())

          f1      = metrics.get("f1_score", 0.0)
          roc_auc = metrics.get("roc_auc", 0.0)
          f1_thresh  = float(os.environ["F1_THRESHOLD"])
          roc_thresh = float(os.environ["ROC_AUC_THRESHOLD"])

          print(f"F1 Score: {f1:.4f} (threshold: >{f1_thresh})")
          print(f"ROC AUC:  {roc_auc:.4f} (threshold: >{roc_thresh})")

          failed = []
          if f1 < f1_thresh:
              failed.append(f"F1 {f1:.4f} < {f1_thresh}")
          if roc_auc < roc_thresh:
              failed.append(f"ROC AUC {roc_auc:.4f} < {roc_thresh}")

          if failed:
              print(f"VALIDATION GATE FAILED: {', '.join(failed)}")
              sys.exit(1)
          print("VALIDATION GATE PASSED")
          EOF

  # ===========================================================================
  # JOB 5 — Bias Detection Gate
  # Blocks if max F1 disparity >= 0.10
  # ===========================================================================
  bias-gate:
    name: Bias Detection Gate
    runs-on: ubuntu-latest
    needs: run-pipeline

    steps:
      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Check bias thresholds
        env:
          BIAS_THRESHOLD: "0.10"
        run: |
          python3 - <<'EOF'
          import os, sys

          bias_file = "model_pipeline/bias_metrics.txt"
          if not os.path.exists(bias_file):
              print("No bias metrics file found — pipeline did not produce bias_metrics.txt. Failing.")
              sys.exit(1)

          threshold  = float(os.environ["BIAS_THRESHOLD"])
          violations = []

          with open(bias_file) as f:
              for line in f:
                  k, v = line.strip().split("=")
                  val = float(v.strip())
                  if abs(val) >= threshold:
                      violations.append(f"{k.strip()}={val:.4f}")

          if violations:
              print(f"BIAS GATE FAILED — disparity >= {threshold}:")
              for v in violations:
                  print(f"  {v}")
              sys.exit(1)
          print(f"BIAS GATE PASSED — all disparities < {threshold}")
          EOF

  # ===========================================================================
  # JOB 6 — Rollback Check
  # Blocks if F1 drops more than 0.02 vs previous passing model
  # ===========================================================================
  rollback-check:
    name: Rollback Check
    runs-on: ubuntu-latest
    needs: [validation-gate, bias-gate]

    steps:
      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Check rollback threshold
        env:
          ROLLBACK_THRESHOLD: "0.02"
        run: |
          python3 - <<'EOF'
          import os, sys

          current_file  = "model_pipeline/metrics.txt"
          previous_file = "model_pipeline/previous_metrics.txt"

          if not os.path.exists(previous_file):
              print("No previous_metrics.txt — first run or baseline not yet established. Skipping rollback check.")
              sys.exit(0)

          def read_metrics(path):
              m = {}
              with open(path) as f:
                  for line in f:
                      k, v = line.strip().split("=")
                      m[k.strip()] = float(v.strip())
              return m

          current   = read_metrics(current_file)
          previous  = read_metrics(previous_file)
          curr_f1   = current.get("f1_score", 0.0)
          prev_f1   = previous.get("f1_score", 0.0)
          threshold = float(os.environ["ROLLBACK_THRESHOLD"])
          drop      = prev_f1 - curr_f1

          print(f"Previous F1: {prev_f1:.4f}")
          print(f"Current F1:  {curr_f1:.4f}")
          print(f"Drop:        {drop:.4f} (max allowed: {threshold})")

          if drop > threshold:
              print(f"ROLLBACK CHECK FAILED — F1 dropped by {drop:.4f}")
              sys.exit(1)
          print("ROLLBACK CHECK PASSED")
          EOF

  # ===========================================================================
  # JOB 7 — Persist Metrics Baseline to GCS
  # Saves current metrics.txt as the baseline for the next run's rollback check.
  # Only runs after all gates pass, on main branch.
  # ===========================================================================
  persist-metrics-baseline:
    name: Persist Metrics Baseline
    runs-on: ubuntu-latest
    needs: rollback-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-metrics
          path: model_pipeline/

      - name: Push current metrics to GCS as new baseline
        run: |
          gsutil cp model_pipeline/metrics.txt \
            gs://savvio-${{ env.ENVIRONMENT }}-mlflow-artifacts/ci/previous_metrics.txt
          echo "Baseline updated in GCS."

  # ===========================================================================
  # JOB 8 — Trigger Deployment (main branch only, after all gates pass)
  # ===========================================================================
  trigger-deployment:
    name: Trigger Deployment CI
    runs-on: ubuntu-latest
    needs: rollback-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Trigger deployment_ci.yml
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deployment_ci.yml',
              ref: 'main',
            });
            console.log('deployment_ci.yml triggered successfully');

  # ===========================================================================
  # JOB 9 — Notify on Failure
  # ===========================================================================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check, run-pipeline, validation-gate, bias-gate, rollback-check]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Model Pipeline CI/CD FAILED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

  # ===========================================================================
  # JOB 10 — Notify on Success
  # ===========================================================================
  notify-on-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [unit-tests, db-connection-check, run-pipeline, validation-gate, bias-gate, rollback-check]
    if: success()

    steps:
      - name: Send success notification
        run: |
          echo "Model Pipeline CI/CD PASSED"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
