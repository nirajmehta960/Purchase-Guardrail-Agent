name: Terraform Infrastructure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'deployment_pipeline/terraform/**'
  push:
    branches: [main]
    paths:
      - 'deployment_pipeline/terraform/**'

# Only one Terraform run at a time to prevent state lock conflicts.
# On PRs, cancel any in-progress plan for the same branch.
# On main push, queue (don't cancel) so applies don't race.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform-dev:
    name: Terraform (dev)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write   # allows posting plan output as a PR comment

    defaults:
      run:
        working-directory: deployment_pipeline/terraform/environments/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Force-unlock stale state lock (if present)
        if: github.event_name != 'pull_request'
        run: |
          # Attempt to unlock any stale lock left by a previously interrupted run.
          # This is safe because concurrency: cancel-in-progress ensures no other
          # run is actively holding the lock when this step executes on main.
          LOCK_ID=$(
            gcloud storage cat \
              gs://savvio-purchase-guardrail-tf-state/env/dev/default.tflock \
              2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ID',''))" \
              2>/dev/null || true
          )
          if [ -n "$LOCK_ID" ]; then
            echo "Stale lock found (ID: $LOCK_ID) — force-unlocking..."
            terraform force-unlock -force "$LOCK_ID" || true
          else
            echo "No stale lock found."
          fi

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('deployment_pipeline/terraform/environments/dev/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (dev)\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: |
          terraform apply \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var-file="terraform.tfvars" \
            -auto-approve

      - name: Show Terraform Outputs
        if: github.event_name != 'pull_request'
        run: |
          echo "=== Terraform Outputs ==="
          echo "DB Connection Name: $(terraform output -raw db_connection_name)"
          echo "API URL:            $(terraform output -raw api_url)"
          echo "MLflow URL:         $(terraform output -raw mlflow_url)"
          echo "VM IP:              $(terraform output -raw pipeline_vm_ip)"
          echo ""
          echo "Next step: grab DB_PASSWORD from GCP Secret Manager → savvio-dev-db-password"
