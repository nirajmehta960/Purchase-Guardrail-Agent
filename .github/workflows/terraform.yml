name: Terraform Infrastructure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/terraform/**'
      - '.github/workflows/terraform.yml'

# One Terraform run at a time globally — PRs and main pushes share the same
# lock so a PR plan and a main apply can never race over the GCS state lock.
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # JOB 1 — Terraform (dev)
  # ===========================================================================
  terraform-dev:
    name: Terraform (dev)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: deployment/terraform/environments/dev

    env:
      TF_VAR_grafana_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
      TF_VAR_grafana_cloud_username: ${{ secrets.GRAFANA_CLOUD_USERNAME }}
      TF_VAR_grafana_remote_write_url: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.14.7' }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('deployment/terraform/environments/dev/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (dev)\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: |
          terraform apply \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var-file="terraform.tfvars" \
            -auto-approve

      - name: Show Terraform Outputs
        if: github.event_name != 'pull_request'
        run: |
          echo "=== Terraform Outputs ==="
          echo "DB Connection Name: $(terraform output -raw db_connection_name)"
          echo "API URL:            $(terraform output -raw api_url)"
          echo "MLflow URL:         $(terraform output -raw mlflow_url)"
          echo "VM IP:              $(terraform output -raw pipeline_vm_ip)"
