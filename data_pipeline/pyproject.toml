[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline"
version = "0.1.0"
description = "SavVio Data Pipeline (Airflow)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["dags"]

[tool.pytest.ini_options]
# Add data_pipeline/dags/ to sys.path so 'src' is importable as a proper package.
# This runs before any conftest.py or plugin, preventing namespace package collisions.
pythonpath = ["dags"]
