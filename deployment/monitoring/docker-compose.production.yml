# Pipeline-VM Prometheus only; Grafana lives on Grafana Cloud.
# prometheus.yml is rendered from prometheus.production.yml by the
# ops-monitoring workflow (envsubst) before this stack starts.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: savvio-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  prometheus-data:

networks:
  monitoring:
    driver: bridge
