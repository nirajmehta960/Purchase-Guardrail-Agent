# SavVio Drift Alert Configuration
# Used by drift_detector.py to determine severity and notification routing.

# ---------------------------------------------------------------------------
# Drift thresholds — share of monitored columns that must drift to trigger
# ---------------------------------------------------------------------------
drift_thresholds:
  green:  0.10
  yellow: 0.25
  red:    0.50

# ---------------------------------------------------------------------------
# Per-column Wasserstein distance thresholds (numeric features only).
# Rating features use a tighter threshold (0.05) since average_rating
# already reached 0.069 in initial testing and drives recommendations.
# Categorical features below use chi-squared (p-value); not configured here.
# ---------------------------------------------------------------------------
column_thresholds:
  default: 0.10
  overrides:
    average_rating:  0.05
    rating_variance: 0.05
    rating_number:   0.05

# ---------------------------------------------------------------------------
# Output distribution drift
# Alerts when a GREEN/YELLOW/RED label share shifts by more than this fraction
# ---------------------------------------------------------------------------
output_shift_threshold: 0.15

# ---------------------------------------------------------------------------
# Latency SLA
# ---------------------------------------------------------------------------
latency_sla_seconds: 2.0

# ---------------------------------------------------------------------------
# Monitored features
#
# Coverage philosophy: monitor every RAW model input (12 numeric + 3 categorical).
# Computed features (affordability_score, value_density, etc.) are deterministic
# functions of these raw inputs — drifting them adds noise, not signal.
#
# - financial / product → numeric, scored with Wasserstein distance.
# - categorical         → chi-squared p-value (default p < 0.05 = drifted).
#
# NOTE: in training_scenarios.csv the product price column is named
# 'product_price'. generate_baseline.py renames it to 'price' so the baseline
# CSV matches the DB column queried by collect_production_data.py.
# ---------------------------------------------------------------------------
monitored_features:
  financial:
    - monthly_income
    - monthly_expenses
    - savings_balance
    - monthly_emi
    - discretionary_income
    - debt_to_income_ratio
    - monthly_expense_burden_ratio
    - emergency_fund_months
    - saving_to_income_ratio
  product:
    - price
    - average_rating
    - rating_number
    - rating_variance
  categorical:
    - employment_status
    - has_loan
    - region

# ---------------------------------------------------------------------------
# Notification routing
# Controls which channels receive alerts at each severity level.
# ---------------------------------------------------------------------------
notification:
  slack:
    enabled: false
    webhook_env_var: SLACK_WEBHOOK_URL
    notify_on: []
  email:
    enabled: true
    recipients_env_var: ALERT_EMAIL_LIST
    notify_on:
      - YELLOW
      - RED