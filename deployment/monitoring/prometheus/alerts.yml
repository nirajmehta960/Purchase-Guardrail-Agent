groups:
  - name: savvio_data_pipeline
    rules:
      - alert: DataPipelineStale
        expr: time() - savvio_dp_pipeline_last_success_timestamp > 90000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Data pipeline has not completed successfully in over 25 hours"
          description: "Last successful run was {{ humanizeDuration $value }} ago. Check Airflow for failed tasks."

      - alert: DataPipelineValidationCriticalFailure
        expr: savvio_dp_validation_checks_failed_critical > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Critical validation failure in data pipeline (stage={{ $labels.stage }})"
          description: "{{ $value }} CRITICAL validation checks failed in stage {{ $labels.stage }}. Pipeline may have halted."

      - alert: DataPipelineStageFailed
        expr: savvio_dp_pipeline_run_success == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Data pipeline run did not complete successfully"
          description: "The most recent Airflow DAG run did not reach the success state."

  - name: savvio_model_pipeline
    rules:
      - alert: ModelChampionF1Low
        expr: savvio_mp_champion_test_f1_score < 0.75
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Champion model test F1 dropped below threshold (model={{ $labels.model }})"
          description: "Champion model {{ $labels.model }} has test F1 of {{ $value | humanizePercentage }}. Threshold is 0.75."

      - alert: ModelPipelineFailed
        expr: savvio_mp_pipeline_success == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Model training pipeline run failed"
          description: "The most recent model pipeline run (run_id={{ $labels.run_id }}) did not complete successfully."

      - alert: ModelChampionBiasGateFailed
        expr: savvio_mp_champion_bias_passed == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Champion model failed the bias gate"
          description: "The selected champion model did not pass bias detection. Review fairness metrics in MLflow."

  - name: savvio_inference_api
    rules:
      - alert: HighAPIErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          /
          rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SavVio API 5xx error rate exceeds 5%"
          description: "Current 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: LLMErrorSpike
        expr: rate(savvio_llm_errors_total[10m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLM call error rate elevated (provider={{ $labels.provider }}, op={{ $labels.operation }})"
          description: "LLM errors at {{ $value }} errors/sec over the last 10 minutes."

      - alert: GuardrailFailureSpike
        expr: rate(savvio_guardrail_failures_total[10m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLM guardrail failure rate is elevated"
          description: "Guardrail failures at {{ $value }} failures/sec over the last 10 minutes. LLM outputs may be inconsistent."

      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, rate(savvio_inference_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 inference latency exceeds 10 seconds"
          description: "p95 inference latency is {{ $value | humanizeDuration }} over the last 5 minutes."
