# Prometheus scrape config — production (renders via envsubst in CI/CD).
# Substituted vars:
#   ${API_HOST}                 — Cloud Run API hostname (no scheme)
#   ${PROMETHEUS_PROJECT_LABEL} — value for external_labels.project
#   ${PROMETHEUS_API_JOB}       — job_name / service label for the API target
#   ${GRAFANA_REMOTE_WRITE_URL} — Grafana Cloud Prometheus remote-write URL
#   ${GRAFANA_CLOUD_USERNAME}   — Grafana Cloud instance numeric ID
#   ${GRAFANA_CLOUD_API_KEY}    — Grafana Cloud API key

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"
    project: "${PROMETHEUS_PROJECT_LABEL}"

# ---------------------------------------------------------------------------
# Remote Write → Grafana Cloud
# ---------------------------------------------------------------------------
remote_write:
  - url: ${GRAFANA_REMOTE_WRITE_URL}
    basic_auth:
      username: ${GRAFANA_CLOUD_USERNAME}
      password: ${GRAFANA_CLOUD_API_KEY}
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500

# ---------------------------------------------------------------------------
# Scrape Configs
# ---------------------------------------------------------------------------
scrape_configs:
  - job_name: "${PROMETHEUS_API_JOB}"
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ["${API_HOST}"]
        labels:
          service: "${PROMETHEUS_API_JOB}"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
