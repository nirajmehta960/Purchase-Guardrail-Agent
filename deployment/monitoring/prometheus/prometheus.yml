# Local Prometheus scrape config. Production uses prometheus.production.yml
# with Grafana Cloud remote-write.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "savvio-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3500"]
        labels:
          environment: "local"
          service: "savvio-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Pushgateway — receives batch metrics from Airflow and model pipeline.
  # honor_labels preserves the 'job' label set by each push client
  # (savvio-data-pipeline, savvio-model-pipeline) instead of overwriting it.
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          environment: "local"
