# Local Prometheus scrape config. Production uses prometheus.production.yml
# with Grafana Cloud remote-write.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "savvio-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3500"]
        labels:
          environment: "local"
          service: "savvio-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
