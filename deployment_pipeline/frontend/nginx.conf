server {
    # Listen on both IPv4 and IPv6 on port 8080.
    # Cloud Run health probes use IPv4; explicitly declaring both prevents
    # nginx's 10-listen-on-ipv6-by-default.sh from rewriting this config
    # to IPv6-only ([::]:8080), which would cause startup probe failures.
    listen 8080;
    listen [::]:8080;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fallback:
    # Browser requests /dashboard -> nginx checks for a file at that path ->
    # doesn't exist -> serves /index.html -> React Router handles it client-side.
    # Without this, page refresh on any route returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite outputs hashed filenames (e.g. index-a1b2c3d4.js).
    # Hash changes when content changes -> safe to cache forever.
    # "immutable" tells browsers/CDNs this URL's content will never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compress text-based assets. Typical savings: 60-80% smaller responses.
    # gzip_min_length 256 skips tiny files where framing overhead > savings.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
