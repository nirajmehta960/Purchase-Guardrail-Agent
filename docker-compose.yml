# Docker compose for SavVio full-stack deployment.
#
# Endpoints:
#   Frontend:  http://localhost:8501  (host:8501 → container:8080)
#   API:       http://localhost:8080

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment_pipeline/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_PORT: "8080"
      DB_ENV: ${DB_ENV:-dev}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: deployment_pipeline/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "8501:8080"   # host 8501 → nginx inside container on 8080
    depends_on:
      - api

volumes:
  pgdata:
